packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/solid-router":
    skills: true
  "@tanstack/solid-start":
    skills: true

skills:
  dirs:
    - .agents/skills
